    }

    .card-selection {
      background-color: white;

      width: 100%;
      padding: 5px 15px;
      margin-top: 20px;
      box-shadow: 0 4px 8px 0px rgba(0, 0, 0, 0.1);

    .card3,

    .card31,

      width: 100%;
      margin-left: 0;

    }

      font-size: 1.5rem;
      margin-left: 0 !important;
    }

      transform: scale(1.3);
      margin-left: 20px;
      cursor: pointer;
    }

    .form-check-label {

    function getSubjectUrl(subjectKey) {
      // NOTE: This function is simplified because direct subject links are no longer used for 10th grade
      // But we keep it as a wrapper in case of future changes.
      return subjectUrls[medium] && subjectUrls[medium][currentClass]
        ? subjectUrls[medium][currentClass][subjectKey]
        : null;
    }

    function getSubjectNameFromOption(optionText) {
      let text = optionText.trim();
      // Remove split markers before translation
      if (text.includes('Volume 1') || text.includes('தொகுதி 1')) text = text.replace(/ Volume 1| தொகுதி 1/, '');
      if (text.includes('Volume 2') || text.includes('தொகுதி 2')) text = text.replace(/ Volume 2| தொகுதி 2/, '');
      if (text.includes('Zoology')) text = text.replace(' Zoology', '');
      if (text.includes('Botany')) text = text.replace(' Botany', '');
      if (text.endsWith(' V1')) text = text.slice(0, -3);
      if (text.endsWith(' V2')) text = text.slice(0, -3);

      const tamilToEnglish = {
        "ஆங்கிலம்": "English", "தமிழ்": "Tamil", "கணிதம்": "Maths",
        "அறிவியல்": "Science", "சமூக அறிவியல்": "Social Science",
        "வேதியியல்": "Chemistry", "இயற்பியல்": "Physics", "உயிரியல்": "Biology",
        "கணினி அறிவியல": "Computer Science", "வணிகக் கணக்கியல்": "Accountancy",
        "பொருளியல்": "Economics", "வணிகவியல்": "Commerce",
        "வணிகக் கணிதம்": "Business Maths", "கணினி பயன்பாடு": "Computer Application",
      };

      return medium === 'English' ? text : tamilToEnglish[text] || null;
    }

    // --- MODIFIED: setUnitOptions (Handles Units or Volume/Branch Selection) ---
    function setUnitOptions(subjectKey, isSplitSelection = false) {
      const subSelect = document.getElementById('volumeSelect');
      const card33 = document.querySelector('.card33');

      let optionsHtml = '';
      let headerText = '';

      // 1. If a split choice (V1/V2/Branch) was JUST made, load the final units.
      if (isSplitSelection) {
        // The subjectKey now includes the split (e.g., 'Maths V1')
        let unitArray = subjectUrls[medium][currentClass][subjectKey];

        headerText = (medium === 'Tamil') ? "அலகு தேர்ந்தெடுக்கவும்" : "SELECT UNIT";
        optionsHtml = `<option value="default">${headerText}</option>`;

        unitArray.forEach((unit) => {
          optionsHtml += `<option value="${unit.link}">${unit.unit_name}</option>`;
        });

      }
      // 2. If subject was just chosen, determine if we need split options OR direct units.
      else {
        if (splitSubjects.includes(subjectKey) && (currentClass === '11th' || currentClass === '12th')) {
          // Load Volume/Branch options (Step 1 of the two-step process)
          if (volumeSubjects.includes(subjectKey)) {
            headerText = (medium === 'Tamil') ? "தொகுதியை தேர்ந்தெடுக்கவும்" : `SELECT VOLUME`;
            optionsHtml = `<option value="default">${headerText}</option>`;
            optionsHtml += `<option value="V1">${subjectKey} ${(medium === 'Tamil') ? 'தொகுதி 1' : 'Volume 1'}</option>`;
            optionsHtml += `<option value="V2">${subjectKey} ${(medium === 'Tamil') ? 'தொகுதி 2' : 'Volume 2'}</option>`;
          } else if (zoologyBotanySubjects.includes(subjectKey)) {
            headerText = (medium === 'Tamil') ? "பிரிவைத் தேர்ந்தெடுக்கவும்" : `SELECT BRANCH`;
            optionsHtml = `<option value="default">${headerText}</option>`;
            optionsHtml += `<option value="Zoology">${(medium === 'Tamil') ? 'விலங்கியல்' : 'Zoology'}</option>`;
            optionsHtml += `<option value="Botany">${(medium === 'Tamil') ? 'தாவரவியல்' : 'Botany'}</option>`;
          }
        } else {
          // Load Units directly for 10th and non-split 11th/12th subjects
          let unitArray = subjectUrls[medium][currentClass][subjectKey];

          headerText = (medium === 'Tamil') ? "அலகு தேர்ந்தெடுக்கவும்" : "SELECT UNIT";
          optionsHtml = `<option value="default">${headerText}</option>`;

          unitArray.forEach((unit) => {
            optionsHtml += `<option value="${unit.link}">${unit.unit_name}</option>`;
          });
        }
      }

      card33.style.display = "block";
      document.querySelector('.card33 h2').textContent = headerText;
      subSelect.innerHTML = optionsHtml;
      subSelect.value = 'default';
    }

    // --- MODIFIED: handleSubjectChange (Checks and triggers the correct unit/volume flow) ---
    function handleSubjectChange() {
      const activeSelect = document.getElementById(medium === 'English' ? 'subjectSelecte' : 'subjectSelectt');
      const selectedText = activeSelect.options[activeSelect.selectedIndex].text;
      const selectedKey = activeSelect.options[activeSelect.selectedIndex].value; // Use value here for simplicity

      // 1. Reset lower cards
      document.querySelector('.card33').style.display = "none";
      document.getElementById('volumeSelect').value = 'default';

      if (selectedKey === 'default' || !selectedText) {
        updateIframeContent(); // Clear iframe
        return;
      }

      // All subjects now go to the Unit Selector.
      const subjectKeyBase = getSubjectNameFromOption(selectedText);
      setUnitOptions(subjectKeyBase, false); // Start the process, not a split selection yet
    }

    // --- MODIFIED: updateIframeContent (Handles final link retrieval for all types) ---
    function updateIframeContent() {
      const iframe = document.getElementById('contentIframe');
      const subSelect = document.getElementById('volumeSelect');
      const subSelectValue = subSelect.value;

      if (subSelectValue === 'default') {
        iframe.src = 'about:blank';
        iframe.contentWindow.document.write('<h3 style="margin: 20px;">Please select the required unit or volume to view content.</h3>');
        return;
      }

      const activeSubjectSelect = document.getElementById(medium === 'English' ? 'subjectSelecte' : 'subjectSelectt');
      const selectedSubjectText = activeSubjectSelect.options[activeSubjectSelect.selectedIndex].text;
      const subjectKeyBase = getSubjectNameFromOption(selectedSubjectText);

      // Check if the current value is a split marker (V1, V2, Zoology, Botany)
      const isSplitMarker = ['V1', 'V2', 'Zoology', 'Botany'].includes(subSelectValue);

      // 1. Handle selection of Volume/Branch (triggers the next step: Unit loading)
      if (isSplitMarker) {
        const splitKey = `${subjectKeyBase} ${subSelectValue}`; // e.g., 'Maths V1'
        setUnitOptions(splitKey, true); // Reload the card with unit links

        // Clear iframe until the unit is selected
        iframe.src = 'about:blank';
        iframe.contentWindow.document.write('<h3 style="margin: 20px;">Please select a Chapter/Unit.</h3>');
        return;
      }
      // 2. Handle selection of the final Unit Link (Value is the final link)
      else {
        const finalLink = subSelectValue;

        if (finalLink && finalLink.startsWith('http')) {
          iframe.src = finalLink;
        } else {
          iframe.src = 'about:blank';
          iframe.contentWindow.document.write(`<h3 style="margin: 20px;">Content link is invalid or not available for this unit.</h3>`);
        }
      }
    }

    function setGroupOptions(lang) {
      const select = document.getElementById('groupSelect');
      const groupData = groups[lang];
      let optionsHtml = '';

      for (const [key, value] of Object.entries(groupData)) {
        const optionValue = key === 'default' ? 'default' : key;
        optionsHtml += `<option value="${optionValue}">${value}</option>`;
      }
      select.innerHTML = optionsHtml;
    }

      document.querySelector('.card31').style.display = "none";
      document.querySelector('.card32').style.display = "none";
      document.querySelector('.card33').style.display = "none";
      document.getElementById('groupSelect').value = 'default';
      document.getElementById('subjectSelecte').innerHTML = '';
      document.getElementById('subjectSelectt').innerHTML = '';
      document.getElementById('volumeSelect').value = 'default';

      document.getElementById('contentIframe').src = 'about:blank';
      document.getElementById('contentIframe').contentWindow.document.write('<h3 style="margin: 20px;">Please select a subject to view content.</h3>');
    }

      currentClass = cls;
      document.querySelector('.card30').style.display = "block";
      document.querySelectorAll('input[name="Medium"]').forEach(r => r.checked = false);
      hideGroupAndSubject();
    }

      medium = 'Tamil';

      if (currentClass === '10th') {
        ten();
      } else {
        eleOrTwel();
      }
    }

    function english() {
      medium = 'English';
      setGroupOptions('English');
      if (currentClass === '10th') {
        ten();
      } else {
        eleOrTwel();
      }
    }

    function ten() {
      document.querySelector('.card31').style.display = "none";
      document.querySelector('.card33').style.display = "none";
      document.querySelector('.card32').style.display = "block";

      document.getElementById('groupSelect').value = 'default';

      if (medium === 'Tamil') {
        document.getElementById('subjectSelecte').style.display = 'none';
        document.getElementById('subjectSelectt').style.display = 'block';
        setSubjectsForTen('Tamil');
      } else {
        document.getElementById('subjectSelectt').style.display = 'none';
        document.getElementById('subjectSelecte').style.display = 'block';
        setSubjectsForTen('English');
      }
      updateIframeContent();
    }

    function eleOrTwel() {
      document.querySelector('.card31').style.display = "block";
      document.querySelector('.card32').style.display = "none";
      document.querySelector('.card33').style.display = "none";

      document.getElementById('subjectSelecte').innerHTML = '';
      document.getElementById('subjectSelectt').innerHTML = '';
      document.getElementById('groupSelect').value = 'default';
    }

    function showSubject() {
      const group = document.getElementById('groupSelect').value;
      const subjectSelectE = document.getElementById('subjectSelecte');
      const subjectSelectT = document.getElementById('subjectSelectt');

      document.querySelector('.card33').style.display = "none";
      document.getElementById('volumeSelect').value = 'default';

      if (group !== 'default') {
        document.querySelector('.card32').style.display = "block";

        if (medium === 'Tamil') {
          subjectSelectE.style.display = 'none';
          subjectSelectT.style.display = 'block';
          setGroupSubjects(group, 'Tamil');
        } else {
          subjectSelectT.style.display = 'none';
          subjectSelectE.style.display = 'block';
          setGroupSubjects(group, 'English');
        }
      } else {
        document.querySelector('.card32').style.display = "none";
        subjectSelectE.style.display = 'none';
        subjectSelectT.style.display = 'none';
      }

      document.getElementById('contentIframe').src = 'about:blank';
      document.getElementById('contentIframe').contentWindow.document.write('<h3 style="margin: 20px;">Please select a subject to view content.</h3>');
